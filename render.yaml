# render.yaml - Configuration pour Render.com
services:
  - type: web
    name: gestion-rh-api
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # À configurer manuellement (Neon PostgreSQL)
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # URL Vercel: https://chez-antoine.vercel.app
      - key: BASE_URL
        sync: false # URL backend Render: https://gestion-rh-vqof.onrender.com
      - key: EMAIL_USER
        sync: false # Gmail pour envoi emails
      - key: EMAIL_PASSWORD
        sync: false # App Password Gmail (16 caractères)
